org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
copyBuildJar=true

# Mod Attributes
modId=healthbars
modName=Health Bars
modVersion=21.10.0.2
modAuthor=Fuzs
modDescription=See every mob's health in style. In the HUD and in-world. Clean, colorful, and customizable!
modLicense=MPL-2.0
modSourceUrl=https://github.com/Fuzss/healthbars
modIssueUrl=https://github.com/Fuzss/healthbars/issues
modUpdateUrl=https://raw.githubusercontent.com/Fuzss/modresources/main/update/healthbars.json
modMavenGroup=fuzs.healthbars
# "MATCH_VERSION" for a mod required on both sides, "IGNORE_SERVER_VERSION" for a server only mod, "IGNORE_ALL_VERSION" for a client only mod
modForgeDisplayTest=IGNORE_ALL_VERSION
# "*" for a mod loaded on both sides, "server" for a server only mod, "client" for a client only mod
modFabricEnvironment=client

# Version Catalog
dependenciesVersionCatalog=1.21.10-v3

# 【勿加 NeoForge 版本覆盖】开发环境刻意沿用目录中的 neoforge-version（21.10.17-beta）。
# 覆盖为更新的版本（如 21.10.64）会让 Architectury Loom 1.11 在配置阶段失败：
#     Failed to provide net.neoforged:neoforge:21.10.64
#       : java.nio.file.NoSuchFileException: data/server.lzma
# 新版 NeoForge 安装器的结构已超出该版 Loom 的支持范围。
# 编译目标与运行环境无需一致：NeoForge 在同一 MC 版本内 API 稳定，且
# neoforge.mods.toml 的依赖区间是 [21.10.14,) 开口向上，
# 因此产物可正常加载于 NeoForge-1.21.10-21.10.64。

# 目录里 shadow-version 写的是动态版本 "9.+"，会解析成最新的 9.x。
# Shadow 9.5.0（2026-07-06）把最低 Gradle 要求提到了 9.2.0，而本项目 wrapper 是 9.1.0，
# 解析到 9.5.0+ 会在配置阶段抛 NoSuchMethodError：
#     AdhocComponentWithVariants.addVariantsFromConfiguration(Provider, Action)
# 该重载是 Gradle 9.2.0 才新增的。此处钉到最后一个兼容 Gradle 9.1.0 的版本。
libs.versions.shadow.version=9.4.3

# 绕开上游 main.gradle 的 bug：它声明发布仓库时写的是
#     url = uri(hasProperty("modResources") ? "${modResources}/maven" : System.getenv("local_maven"))
# 两者都没有时即为 uri(null)，配置阶段直接失败。1.21.8 那版因为运算符优先级
# 写错反而永远走 true 分支、得到相对路径 "null/maven"，才一直没暴露出来。
# 这里给一个相对路径即可：该仓库只在发布时才会被访问，本 fork 从不发布。
# 用相对路径而非绝对路径，是为了不绑定到某台机器；build/ 已在 .gitignore 中。
# 上游修复后本行即可删除。
modResources=build/fuzs-maven
#dependenciesPuzzlesLibVersion=21.8.0
#dependenciesMinPuzzlesLibVersion=21.8.0

# Mod Publishing
projectReleaseType=release
projectCurseForgeId=1367734
projectModrinthId=A3VSiTms

# Required Dependencies
dependenciesRequiredFabricCurseForge=fabric-api, forge-config-api-port-fabric, puzzles-lib
dependenciesRequiredNeoForgeCurseForge=puzzles-lib
dependenciesRequiredFabricModrinth=fabric-api, forge-config-api-port, puzzles-lib
dependenciesRequiredNeoForgeModrinth=puzzles-lib
